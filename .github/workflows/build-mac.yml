name: Build SceneShelf Mac installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - name: Read the build recipe
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify the published build kit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 180 \
            https://github.com/y23309257-ai/sceneshelf-mac-build/releases/download/v0.6.3-buildkit/SceneShelf-Mac-PKG-BuildKit.zip \
            -o kit.zip
          echo 'e9ca4cea3ba85a10c08d4006e02e7d198c37943ecd77cb145b4c6305b6c522a4  kit.zip' | shasum -a 256 -c -
          unzip -q kit.zip
      - name: Build the native installer without interactive prompts
        shell: bash
        run: |
          set -euo pipefail
          # The kit's own script carries the app version (0.6+); build-package.sh is kept only for old kits.
          cd SceneShelf-Mac-PKG-BuildKit
          CI=true bash Build-SceneShelf-PKG.command
          mkdir -p ../artifacts
          package=$(find . -name 'SceneShelf-Mac-${{ matrix.arch }}.pkg' -type f)
          test -n "$package"
          pkgutil --payload-files "$package" | tee ../artifacts/payload-${{ matrix.arch }}.txt
          grep -q 'server.mjs' ../artifacts/payload-${{ matrix.arch }}.txt
          grep -q 'mac-launcher.mjs' ../artifacts/payload-${{ matrix.arch }}.txt
          cp "$package" ../artifacts/
          cd ../artifacts
          shasum -a 256 SceneShelf-Mac-${{ matrix.arch }}.pkg > SceneShelf-Mac-${{ matrix.arch }}.pkg.sha256
      - name: Prepare Node.js for installation checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
      - name: Install and check the native runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/sbin/installer -pkg artifacts/SceneShelf-Mac-${{ matrix.arch }}.pkg -target /
          cd /Applications/SceneShelf.app/Contents/Resources/runtime
          test "$(node -p process.arch)" = '${{ matrix.arch }}'
          node --input-type=module -e "import sharp from 'sharp'; const p=await sharp({create:{width:2,height:2,channels:3,background:'#123456'}}).png().toBuffer(); if(!p.length) throw Error('Image runtime failed'); console.log('Native image processing OK');"
          SCENESHELF_STORAGE="$RUNNER_TEMP/sceneshelf-test-data" PORT=4398 node server.mjs > "$RUNNER_TEMP/sceneshelf-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4398/api/health > "$RUNNER_TEMP/health.json"; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/sceneshelf-server.log"; exit 1; fi
            sleep 1
          done
          node --input-type=module -e "import fs from 'node:fs'; const h=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/health.json','utf8')); if(h.app!=='SceneShelf'||h.bridgeVersion!==2||h.appVersion!=='0.6.3') throw Error('Unexpected health response'); console.log('Server health OK');"
          curl --fail --silent http://127.0.0.1:4398/ | grep -q '<!doctype html>'
          # 0.6.2+: the app downloads its Mac helper tools on first launch (FFmpeg, Whisper, Real-ESRGAN). Check they arrive and run.
          tools="$RUNNER_TEMP/sceneshelf-test-data/tools"
          if grep -q 'whisper-cli-b5454-darwin' server.mjs; then
            for attempt in {1..150}; do
              if [ -x "$tools/ffmpeg/ffmpeg" ] && [ -x "$tools/ffmpeg/ffprobe" ] && [ -x "$tools/whisper/whisper-cli" ] && [ -f "$tools/whisper/ggml-large-v3-turbo-q5_0.bin" ] && [ -x "$tools/realesrgan/realesrgan-ncnn-vulkan" ]; then break; fi
              if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/sceneshelf-server.log"; exit 1; fi
              sleep 8
            done
            ls -la "$tools"/*/ | head -40
            "$tools/ffmpeg/ffmpeg" -hide_banner -encoders | grep ' libx264 ' && echo "FFMPEG OK"
            say -v Yuna "안녕하세요. 오늘은 날씨가 정말 좋네요." -o "$RUNNER_TEMP/ko.aiff"
            "$tools/ffmpeg/ffmpeg" -hide_banner -loglevel error -y -i "$RUNNER_TEMP/ko.aiff" -ar 16000 -ac 1 -c:a pcm_s16le "$RUNNER_TEMP/ko.wav"
            "$tools/whisper/whisper-cli" -m "$tools/whisper/ggml-large-v3-turbo-q5_0.bin" -f "$RUNNER_TEMP/ko.wav" -l ko -np -t 4 | tee "$RUNNER_TEMP/ko.txt"
            grep -q '날씨' "$RUNNER_TEMP/ko.txt" && echo "WHISPER OK"
            "$tools/ffmpeg/ffmpeg" -hide_banner -loglevel error -f lavfi -i testsrc=size=64x64 -frames:v 1 -y "$RUNNER_TEMP/in.png"
            "$tools/realesrgan/realesrgan-ncnn-vulkan" -i "$RUNNER_TEMP/in.png" -o "$RUNNER_TEMP/out.png" -n realesr-animevideov3 -s 2 -m "$tools/realesrgan/models" && file "$RUNNER_TEMP/out.png" | grep -q '128 x 128' && echo "UPSCALE OK"
          fi
      - name: Save installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SceneShelf-Mac-${{ matrix.arch }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
